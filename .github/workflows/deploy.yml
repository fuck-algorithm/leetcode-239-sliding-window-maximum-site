name: Deploy static visualization to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Quality gates
        run: |
          npm run qa:guard
          npm run lint
          npm run type-check
          npm run test:coverage
          npm run test:e2e

      - name: Fetch source repository Star count
        env:
          GH_TOKEN: ${{ secrets.PAGES_SOURCE_READ_TOKEN }}
        run: >-
          gh api repos/fuck-algorithm/leetcode-239-sliding-window-maximum
          --jq '{stargazers_count: .stargazers_count}' > public/data/github-stars.json

      - name: Build site
        run: npm run build
        env:
          VITE_APP_BASE: /leetcode-239-sliding-window-maximum-site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
